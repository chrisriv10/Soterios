<!doctype html>
<html><head><meta charset="utf-8"><title>Soterios Scan Report</title>
<style>
  body{font-family:Segoe UI,Arial,sans-serif;margin:32px;color:#15202b;background:#fff}
  .muted{color:#667085}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
  .card{border:1px solid #d7dde5;border-radius:6px;padding:14px}
  table{width:100%;border-collapse:collapse;margin-top:16px}
  th,td{text-align:left;border-bottom:1px solid #e6eaf0;padding:8px;font-size:13px}
  .danger{color:#b42318}
  .ok{color:#027a48}
  .warn{color:#b54708}
  pre{white-space:pre-wrap;word-break:break-word}
</style>
</head><body>
<h1>Soterios Scan Report</h1>
<div class="muted">Generated {{GENERATED_AT}}</div>
<div class="grid">
  <div class="card"><div class="muted">Type</div><h2>{{SCAN_TYPE}}</h2></div>
  <div class="card"><div class="muted">Status</div><h2 class="{{STATUS_CLASS}}">{{STATUS}}</h2></div>
  <div class="card"><div class="muted">Files Scanned</div><h2>{{FILES_SCANNED}}</h2></div>
  <div class="card"><div class="muted">Threats</div><h2 class="{{THREATS_CLASS}}">{{THREATS_FOUND}}</h2></div>
</div>
<h2>Targets</h2><pre>{{TARGETS}}</pre>
<h2>Threat Details</h2>
<table><thead><tr><th>Name</th><th>Path</th></tr></thead><tbody>{{THREAT_ROWS}}</tbody></table>
<h2>Errors and Notes</h2><ul>{{ERRORS}}</ul>
</body></html>
