name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Verify source and native collector
        run: |
          npm run native:check
          npm run native-host:build
          npm test

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Generate release checksums and dependency metadata
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object { "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
          npm sbom --sbom-format cyclonedx | Set-Content dist/soterios-node.cdx.json
          cargo metadata --locked --format-version 1 --manifest-path native/process-inspector/Cargo.toml | Set-Content dist/soterios-rust-metadata.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/soterios-node.cdx.json
            dist/soterios-rust-metadata.json
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "${{ github.ref_name }}" dist/*.exe dist/SHA256SUMS.txt dist/soterios-node.cdx.json dist/soterios-rust-metadata.json \
            --title "Soterios ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
