<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="src/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font: 13px/1.4 var(--font-family); color: var(--text-main); background: var(--bg-base); }
    .header { display: flex; align-items: center; gap: 10px; padding: 16px; background: var(--bg-surface); border-bottom: 1px solid var(--glass-border); }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 15px; font-weight: 600; }
    .section { padding: 16px; border-bottom: 1px solid var(--glass-border); }
    .section:last-child { border-bottom: none; }
    .label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .input-group { display: flex; gap: 8px; }
    input[type="password"] { flex: 1; padding: 8px 12px; border: 1px solid var(--glass-border); border-radius: 6px; font: inherit; color: var(--text-main); background: var(--bg-surface); }
    input[type="password"]:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-glow); }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font: inherit; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent-primary); color: var(--accent-primary-contrast); }
    .btn-primary:hover { background: var(--accent-primary-dark); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .result { margin-top: 12px; padding: 12px; border-radius: 6px; display: none; }
    .result.safe { background: var(--accent-success-glow); border: 1px solid var(--accent-success); color: var(--accent-success); }
    .result.pwned { background: var(--accent-danger-glow); border: 1px solid var(--accent-danger); color: var(--accent-danger); }
    .result-title { font-weight: 600; margin-bottom: 4px; }
    .result-detail { font-size: 12px; opacity: 0.8; }
    .settings-link { display: block; text-align: center; padding: 12px; color: var(--accent-primary); text-decoration: none; font-size: 12px; }
    .settings-link:hover { text-decoration: underline; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-success); }
    .status-dot.offline { background: var(--accent-danger); }
    .loading { display: none; }
    .loading.active { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--glass-border); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="">
    <h1>Soterios Credential Safety</h1>
  </div>

  <div class="section">
    <div class="label">Check a Password</div>
    <div class="input-group">
      <input type="password" id="passwordInput" placeholder="Enter password to check" autocomplete="off">
      <button class="btn btn-primary" id="checkBtn"><span class="loading" id="loader"></span> Check</button>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="section">
    <div class="label">Desktop App</div>
    <div class="status">
      <span class="status-dot offline" id="statusDot"></span>
      <span id="statusText">Checking connection...</span>
    </div>
  </div>

  <a class="settings-link" href="#" id="openOptions">Settings</a>

  <script src="src/popup.js"></script>
</body>
</html>
